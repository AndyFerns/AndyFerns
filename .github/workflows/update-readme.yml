name: Update Projects Section in README

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Public Repos and Inject into README
        run: |
          echo "Fetching public repos..."
          curl -s "https://api.github.com/users/AndyFerns/repos?per_page=100&type=public" | \
            jq -r '.[] | select(.private == false and .fork == false) | "- [\(.name)](\(.html_url)) - \(.description // "No description")"' > projects.md
      
          echo "Injecting into README..."
          awk '
            /<!--START_PROJECTS-->/ {
              print;
              while ((getline line < "projects.md") > 0) print line;
              skip=1; next
            }
            /<!--END_PROJECTS-->/ { print; skip=0; next }
            skip != 1 { print }
          ' README.md > README.tmp && mv README.tmp README.md


      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add README.md
            git commit -m "Auto-update projects section"
            git push
          fi
