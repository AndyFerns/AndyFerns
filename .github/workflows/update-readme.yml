name: Update Projects Section in README

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Public Repos and Inject into README
        run: |
          echo "Fetching repo list..."
          REPOS=$(curl -s "https://api.github.com/users/AndyFerns/repos?per_page=100" | jq -r '.[] | select(.fork == false) | "- [\(.name)](\(.html_url)) - \(.description // "No description")"')

          echo "Updating README..."
          awk -v repos="$REPOS" '
            BEGIN { print_section=1 }
            /<!--START_PROJECTS-->/ { print; print repos; print_section=0; next }
            /<!--END_PROJECTS-->/ { print_section=1 }
            print_section { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Auto-update projects section" || echo "No changes to commit"
          git push
