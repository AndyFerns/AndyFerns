name: Update Projects Section in README

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Update Projects Table
        run: |
          echo "Generating projects table..."

          echo '| Project | Description | Languages |' > projects.md
          echo '|---------|-------------|-----------|' >> projects.md

          repos=$(curl -s https://api.github.com/users/AndyFerns/repos?per_page=100&type=public)

          echo "$repos" | jq -r '
            map(select(.fork == false)) |
            map({
              name: .name,
              url: .html_url,
              desc: (.description // "No description"),
              stars: .stargazers_count,
              forks: .forks_count,
              score: (.stargazers_count + .forks_count)
            }) |
            sort_by(-.score) |
            .[:7] |
            .[]
            | [.name, .url, .desc] | @tsv
          ' | while IFS=$'\t' read -r name url desc; do
            lang_data=$(curl -s "https://api.github.com/repos/AndyFerns/$name/languages")
            langs=""
            for lang in $(echo "$lang_data" | jq -r 'keys[]'); do
              case "$lang" in
                Python) badge="![Python](https://img.shields.io/badge/Python-3572A5?style=for-the-badge&logo=python&logoColor=white)" ;;
                C) badge="![C](https://img.shields.io/badge/C-00599C?style=for-the-badge&logo=c&logoColor=white)" ;;
                C++) badge="![C++](https://img.shields.io/badge/C++-00599C?style=for-the-badge&logo=c%2B%2B&logoColor=white)" ;;
                JavaScript) badge="![JS](https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black)" ;;
                HTML) badge="![HTML](https://img.shields.io/badge/HTML-E34F26?style=for-the-badge&logo=html5&logoColor=white)" ;;
                CSS) badge="![CSS](https://img.shields.io/badge/CSS-1572B6?style=for-the-badge&logo=css3&logoColor=white)" ;;
                Rust) badge="![Rust](https://img.shields.io/badge/Rust-000000?style=for-the-badge&logo=rust&logoColor=white)" ;;
                Java) badge="![Java](https://img.shields.io/badge/Java-ED8B00?style=for-the-badge&logo=java&logoColor=white)" ;;
                *) badge="![${lang}](https://img.shields.io/badge/${lang}-gray?style=for-the-badge)" ;;
              esac
              langs="${langs} ${badge}"
            done

            echo "| [$name]($url) | $desc | $langs |" >> projects.md
          done

          echo "Injecting table into README..."

          awk '
            /<!--START_PROJECTS-->/ {
              print;
              while ((getline line < "projects.md") > 0) print line;
              skip=1; next
            }
            /<!--END_PROJECTS-->/ { print; skip=0; next }
            skip != 1 { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if git diff --quiet; then
            echo "✅ No changes to commit."
          else
            git add README.md
            git commit -m "Update top 7 projects by popularity (stars + forks)"
            git push origin main
          fi
